server {
    listen 80;
    server_name _;

    client_max_body_size 10M;
    root /site/_site;
    index index.html;

    # Docker service IPs can change when containers are recreated. Resolve the
    # chatbot service through Docker DNS at request time so nginx does not keep
    # a stale upstream address after deploys.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $chatbot_upstream http://chatbot:3001;

    # Chatbot health check
    location = /health {
        proxy_pass $chatbot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Chatbot API proxy — /api/chat, /api/generate-image, anything else the
    # Flask backend exposes under /api/.
    location /api/ {
        # Handle CORS preflight without hitting the backend
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-DM-Passphrase, X-Admin-Token';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Image generation can take 30-90s — extend the proxy read timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass $chatbot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eleventy-built PWA: /manifest.webmanifest and /sw.js must be served
    # from the root origin for install + service-worker scope.
    location / {
        try_files $uri $uri/ =404;
    }
}
