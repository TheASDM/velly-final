server {
    listen 80;
    server_name _;

    client_max_body_size 10M;
    root /usr/share/nginx/html;
    index index.html;

    # Standalone chatbot page + static assets (CSS, JS)
    location / {
        try_files $uri $uri/ =404;
    }

    # Chatbot health check
    location /health {
        proxy_pass http://chatbot:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Chatbot API proxy — /api/chat, /api/generate-image, anything else the
    # Flask backend exposes under /api/.
    location /api/ {
        # Handle CORS preflight without hitting the backend
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-DM-Passphrase, X-Admin-Token';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Image generation can take 30-90s — extend the proxy read timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://chatbot:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
