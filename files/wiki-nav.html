<!--
  Valley of Shadows custom navigation.
  Paste this entire file into Wiki.js Admin → Theme → Body HTML Injection
  (with Wiki.js's built-in navigation disabled in the same panel).

  - Top bar: static links to the major sections + Loremaster + Using Enzo.
  - Sidebar: dynamic collapsible tree fetched from /images/sitemap.json on
    every page load. Run `python3 build_sitemap.py` after adding pages, commit
    and push — the next page load picks the new tree up.
-->

<style>
  :root {
    --vos-gold-bright: #d4a574;
    --vos-gold-dim: #8b7355;
    --vos-cream: #e8dcc8;
    --vos-text: #c9b896;
    --vos-bg: rgba(13, 11, 17, 0.97);
    --vos-border: rgba(139, 115, 85, 0.3);
  }

  /* ── Top bar ───────────────────────────────────────────────────────── */
  .vos-topnav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1100;
    background: var(--vos-bg);
    border-bottom: 1px solid var(--vos-border);
    padding: 0.55rem 1.5rem;
    display: flex; align-items: center; gap: 0.25rem;
    font-family: 'Cinzel', Georgia, serif;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .vos-topnav .vos-hamburger {
    display: none; cursor: pointer; color: var(--vos-gold-bright);
    font-size: 1.3rem; padding: 0 0.5rem; user-select: none;
  }
  .vos-topnav .vos-logo {
    font-weight: bold; color: var(--vos-gold-bright);
    font-size: 0.78rem; letter-spacing: 0.32em; text-transform: uppercase;
    margin-right: 1.5rem; text-decoration: none;
  }
  .vos-topnav a:not(.vos-logo) {
    font-size: 0.66rem; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--vos-gold-dim); text-decoration: none;
    padding: 0.5rem 0.85rem;
    transition: color 0.2s;
  }
  .vos-topnav a:hover { color: var(--vos-gold-bright); }
  .vos-topnav a.vos-active { color: var(--vos-gold-bright); }
  .vos-topnav .vos-spacer { flex: 1; }
  @media (max-width: 1023px) {
    .vos-topnav { padding: 0.55rem 0.75rem; gap: 0.5rem; flex-wrap: wrap; }
    .vos-topnav .vos-hamburger { display: inline-block; }
    .vos-topnav a:not(.vos-logo):not(.vos-mobile-show) { display: none; }
  }

  /* ── Sidebar ────────────────────────────────────────────────────────── */
  .vos-sidebar {
    position: fixed; top: 52px; left: 0; bottom: 0; width: 280px; z-index: 1000;
    background: var(--vos-bg);
    border-right: 1px solid var(--vos-border);
    overflow-y: auto;
    padding: 1.5rem 1rem 3rem;
    font-family: Georgia, serif;
    transition: transform 0.3s ease;
  }
  .vos-sidebar::-webkit-scrollbar { width: 8px; }
  .vos-sidebar::-webkit-scrollbar-track { background: transparent; }
  .vos-sidebar::-webkit-scrollbar-thumb { background: rgba(139, 115, 85, 0.3); border-radius: 4px; }

  .vos-section { margin-bottom: 0.4rem; }
  .vos-section-title {
    display: flex; align-items: center; cursor: pointer; user-select: none;
    color: var(--vos-gold-bright);
    font-family: 'Cinzel', Georgia, serif;
    letter-spacing: 0.18em; text-transform: uppercase;
    font-size: 0.72rem;
    padding: 0.55rem 0.25rem; border-bottom: 1px solid rgba(139, 115, 85, 0.15);
  }
  .vos-section-title::before {
    content: '▸'; display: inline-block; margin-right: 0.5rem; opacity: 0.7;
    transition: transform 0.2s; font-size: 0.7rem;
  }
  .vos-section.vos-open > .vos-section-title::before { transform: rotate(90deg); }
  .vos-pages { display: none; padding: 0.4rem 0 0.5rem 0.7rem; border-left: 1px solid rgba(139, 115, 85, 0.12); margin-left: 0.6rem; }
  .vos-section.vos-open > .vos-pages { display: block; }
  .vos-page {
    display: block; color: var(--vos-text); text-decoration: none;
    padding: 0.32rem 0.25rem; font-size: 0.85rem; line-height: 1.35;
    border-radius: 3px;
    transition: color 0.15s, background 0.15s;
  }
  .vos-page:hover { color: var(--vos-gold-bright); background: rgba(212, 165, 116, 0.05); }
  .vos-page.vos-active {
    color: var(--vos-gold-bright); background: rgba(212, 165, 116, 0.1);
    border-left: 2px solid var(--vos-gold-bright); padding-left: 0.5rem;
    margin-left: -0.5rem;
  }
  .vos-section.vos-nested { padding-left: 0.7rem; }
  .vos-section.vos-nested > .vos-section-title { font-size: 0.66rem; opacity: 0.85; }

  /* ── Layout: push Wiki.js content over to make room ──────────────────── */
  body { padding-top: 52px !important; }
  @media (min-width: 1024px) {
    .page-col-cont, .contents, .v-main__wrap, main {
      padding-left: 280px !important;
      box-sizing: border-box;
    }
  }
  @media (max-width: 1023px) {
    .vos-sidebar { transform: translateX(-100%); }
    .vos-sidebar.vos-open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0, 0, 0, 0.6); }
  }
</style>

<nav class="vos-topnav">
  <span class="vos-hamburger vos-mobile-show" id="vos-hamburger">☰</span>
  <a href="/" class="vos-logo vos-mobile-show">Valley of Shadows</a>
  <a href="/en/Venturia/index">Venturia</a>
  <a href="/en/Venturia/Characters/index">Characters</a>
  <a href="/en/Venturia/Locations/index">Locations</a>
  <a href="/en/Articles/index">Articles</a>
  <a href="/en/Updates/index">Updates</a>
  <a href="/en/Class-Changes/index">Class Changes</a>
  <a href="/en/House-Rules/index">House Rules</a>
  <span class="vos-spacer"></span>
  <a href="/enzo/">Enzo</a>
  <a href="https://reference.valleyofshadows.wiki/enzo/" target="_blank" rel="noopener">Using Enzo</a>
</nav>

<aside class="vos-sidebar" id="vos-sidebar">
  <div style="color:var(--vos-gold-dim);font-size:0.75rem;letter-spacing:0.1em;">Loading…</div>
</aside>

<script>
(function () {
  // ── Highlight current top-bar item ──────────────────────────────────
  const here = location.pathname.replace(/\/$/, '');
  document.querySelectorAll('.vos-topnav a').forEach(a => {
    const href = a.getAttribute('href');
    if (!href || href.startsWith('http')) return;
    const base = href.replace(/\/index\/?$/, '').replace(/\/$/, '');
    if (base && here.startsWith(base)) a.classList.add('vos-active');
  });

  // ── Hamburger toggle ─────────────────────────────────────────────────
  const sidebar = document.getElementById('vos-sidebar');
  document.getElementById('vos-hamburger').addEventListener('click', () => {
    sidebar.classList.toggle('vos-open');
  });

  // ── Title-case folder names (for tree section headers, which aren't pages) ──
  function titleCase(slug) {
    return slug
      .replace(/-/g, ' ')
      .replace(/\bdm\b/i, 'DM')
      .replace(/\bpcs\b/i, 'PCs')
      .replace(/\bnpcs\b/i, 'NPCs')
      .replace(/\bvava\b/i, 'VAVA')
      .replace(/\bphb\b/i, 'PHB')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  // ── Build sidebar tree from images/sitemap.json ──────────────────────
  async function buildSidebar() {
    try {
      const r = await fetch('/images/sitemap.json', { credentials: 'same-origin' });
      if (!r.ok) throw new Error('sitemap.json ' + r.status);
      const entries = await r.json();

      // Build a nested tree from URL paths
      const tree = {};
      for (const e of entries) {
        let p = e.url.replace(/^\/+en\/+/, '').replace(/^\/+/, '').replace(/\/$/, '');
        if (!p || p === '') continue; // skip home itself (top-bar has it)
        if (/^Venturia\/DM(\/|$)/i.test(p)) continue;
        const parts = p.split('/');
        let node = tree;
        for (let i = 0; i < parts.length; i++) {
          const key = parts[i];
          if (i === parts.length - 1) {
            node[key] = node[key] || { _children: {} };
            node[key]._url = e.url;
            node[key]._title = e.title;
            node[key]._isPage = true;
          } else {
            node[key] = node[key] || { _children: {} };
            node = node[key]._children;
          }
        }
      }

      // Render tree
      function render(children, depth) {
        const keys = Object.keys(children).sort((a, b) => {
          // index first, then alpha
          if (a === 'index') return -1;
          if (b === 'index') return 1;
          return a.localeCompare(b);
        });
        let html = '';
        for (const key of keys) {
          const child = children[key];
          const hasChildren = Object.keys(child._children).length > 0;
          const url = child._url;

          if (key === 'index') {
            // Render the section's own index page as a top-level link
            const active = url && url.replace(/\/$/, '') === here ? 'vos-active' : '';
            html += `<a class="vos-page ${active}" href="${url}" style="font-style:italic;opacity:0.85;">index →</a>`;
            continue;
          }

          if (hasChildren) {
            const nested = depth > 0 ? 'vos-nested' : '';
            html += `<div class="vos-section ${nested}">
              <div class="vos-section-title">${titleCase(key)}</div>
              <div class="vos-pages">${render(child._children, depth + 1)}</div>
            </div>`;
          } else if (child._isPage && url) {
            const active = url.replace(/\/$/, '') === here ? 'vos-active' : '';
            const title = child._title || titleCase(key);
            html += `<a class="vos-page ${active}" href="${url}">${title}</a>`;
          }
        }
        return html;
      }

      sidebar.innerHTML = render(tree, 0);

      // Wire section toggles
      sidebar.querySelectorAll('.vos-section-title').forEach(el => {
        el.addEventListener('click', () => el.parentElement.classList.toggle('vos-open'));
      });

      // Auto-expand the path that contains the current page
      const active = sidebar.querySelector('.vos-page.vos-active');
      if (active) {
        let p = active.parentElement;
        while (p && p !== sidebar) {
          if (p.classList && p.classList.contains('vos-section')) p.classList.add('vos-open');
          p = p.parentElement;
        }
        // Scroll into view
        setTimeout(() => active.scrollIntoView({ block: 'center', behavior: 'instant' }), 50);
      } else {
        // Open the first section by default so the sidebar doesn't look empty
        const first = sidebar.querySelector('.vos-section');
        if (first) first.classList.add('vos-open');
      }
    } catch (e) {
      sidebar.innerHTML = '<div style="color:var(--vos-gold-dim);font-size:0.78rem;line-height:1.5;">Couldn\'t load sidebar tree. Run <code>python3 build_sitemap.py</code> on the repo, commit, and push so /images/sitemap.json appears as a wiki asset.</div>';
      console.error('vos-sidebar build failed:', e);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildSidebar);
  } else {
    buildSidebar();
  }
})();
</script>
