version: '3.8'

services:
  # PostgreSQL database - this stores all your Wiki.js content
  postgres:
    image: postgres:15-alpine
    container_name: dnd_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wiki}
      POSTGRES_USER: ${POSTGRES_USER:-wikijs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # This ensures your wiki data persists even if the container restarts
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dnd-network
    restart: unless-stopped

  # Wiki.js - the main wiki engine for your campaign content
  wikijs:
    image: ghcr.io/requarks/wiki:2
    container_name: dnd_wiki
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-wikijs}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-wiki}
    networks:
      - dnd-network
    restart: unless-stopped

  # Chatbot service - Python/Flask RAG-powered lore assistant + Eleventy codex
  # The same container now runs both the gunicorn API (:3001 internal) and the
  # Eleventy --serve dev server for the static codex site (:8080 internal,
  # mapped to :8088 on the host).
  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    container_name: dnd_chatbot
    ports:
      - "8088:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      OLLAMA_URL: ${OLLAMA_URL:-https://ai.raptornet.dev/ollama}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-${OPENWEBUI_API_KEY:-}}
      TEMPERATURE: ${TEMPERATURE:-0.2}
      # OpenAI image generation (used by the /art slash command)
      OPENAI_KEY: ${OPENAI_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-1}
      IMAGE_STYLE_PROMPT: ${IMAGE_STYLE_PROMPT:-}
    volumes:
      # Campaign data files + vector stores (read-only)
      - ./campaign-data:/app/data:ro
      # Writable volume for chat logs
      - ./logs:/app/logs
      # Art Studio gallery — persisted images + manifest. Survives container
      # rebuilds. Created on first generation if it doesn't exist on the host.
      - ./generated-art:/app/generated-art
      # Repo mounted in for Eleventy to read markdown/templates live.
      # Eleventy + Pagefind live in /opt/eleventy (baked into the image),
      # so no anonymous-volume shadow is needed for /site/node_modules.
      - .:/site
    networks:
      - dnd-network
    restart: unless-stopped

  # Nginx - the web server that handles all incoming requests and routes them
  nginx:
    image: nginx:alpine
    container_name: dnd_nginx
    ports:
      - "8080:80"
    volumes:
      # Nginx config tells it how to route different URLs
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Lore Master chatbot page and assets
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - wikijs
      - chatbot
    networks:
      - dnd-network
    restart: unless-stopped

# Docker networks let containers talk to each other by name
networks:
  dnd-network:
    driver: bridge

# Named volumes persist data between container restarts
volumes:
  postgres-data:
