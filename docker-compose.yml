services:
  # Chatbot service - Python/Flask RAG-powered lore assistant + Eleventy build
  # The container builds the static codex into /site/_site at startup, then
  # runs the gunicorn API on :3001 internal. nginx serves _site and proxies API.
  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    container_name: dnd_chatbot
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      OLLAMA_URL: ${OLLAMA_URL:-https://ai.raptornet.dev/ollama}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-${OPENWEBUI_API_KEY:-}}
      TEMPERATURE: ${TEMPERATURE:-0.2}
      APP_DB_PATH: ${APP_DB_PATH:-/app/app-data/vallombrosa.sqlite3}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-15552000}
      PLAYER_LOGIN_CODES: ${PLAYER_LOGIN_CODES:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:dm@valleyofshadows.wiki}
      # OpenAI image generation (used by the /art slash command)
      OPENAI_KEY: ${OPENAI_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      IMAGE_STYLE_PROMPT: ${IMAGE_STYLE_PROMPT:-}
      # DM passphrase gates the Art Studio gallery delete button.
      # Unset = delete disabled (gallery is append-only via the API).
      DM_PASSPHRASE: ${DM_PASSPHRASE:-}
    volumes:
      # Campaign data files + vector stores (read-only)
      - ./campaign-data:/app/data:ro
      # Writable volume for chat logs
      - ./logs:/app/logs
      # PWA runtime database — one SQLite file, backed up by copying it.
      - ./app-data:/app/app-data
      # Art Studio gallery — persisted images + manifest. Survives container
      # rebuilds. Created on first generation if it doesn't exist on the host.
      - ./generated-art:/app/generated-art
      # Repo mounted in for Eleventy to read markdown/templates and write _site.
      # Eleventy + Pagefind live in /opt/eleventy (baked into the image),
      # so no anonymous-volume shadow is needed for /site/node_modules.
      - .:/site
    networks:
      - dnd-network
    restart: unless-stopped

  # Nginx - the web server that handles all incoming requests and routes them
  nginx:
    image: nginx:alpine
    container_name: dnd_nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Nginx config tells it how to route different URLs
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Built Eleventy PWA. The chatbot container writes /site/_site.
      - .:/site:ro
    depends_on:
      - chatbot
    networks:
      - dnd-network
    restart: unless-stopped

# Docker networks let containers talk to each other by name
networks:
  dnd-network:
    driver: bridge
