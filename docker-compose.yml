services:
  # Chatbot service - Python/Flask RAG-powered lore assistant + Eleventy build
  # The container builds the static codex into /site/_site at startup, then
  # runs the gunicorn API on :3001 internal. nginx serves _site and proxies API.
  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    container_name: dnd_chatbot
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      MAX_TOKENS: ${MAX_TOKENS:-2048}
      OLLAMA_URL: ${OLLAMA_URL:-https://ai.raptornet.dev/ollama}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-${OPENWEBUI_API_KEY:-}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      RAG_AUTO_THRESHOLD: ${RAG_AUTO_THRESHOLD:-0.3}
      RAG_LIST_THRESHOLD: ${RAG_LIST_THRESHOLD:-0.4}
      TEMPERATURE: ${TEMPERATURE:-0.2}
      NEXT_SESSION_DATE: ${NEXT_SESSION_DATE:-}
      APP_DB_PATH: ${APP_DB_PATH:-/app/app-data/vallombrosa.sqlite3}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # DM Google fallback for the standalone /dm page. App-level OAuth uses
      # AUTH_TOKEN_SECRET and the player/DM maps below.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_OAUTH_CLIENT_ID:-}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET:-}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:-}
      GOOGLE_PLAYER_MAP: ${GOOGLE_PLAYER_MAP:-}
      DISCORD_PLAYER_MAP: ${DISCORD_PLAYER_MAP:-}
      ALLOWED_DM_DISCORD_IDS: ${ALLOWED_DM_DISCORD_IDS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-1}
      ALLOWED_DM_EMAILS: ${ALLOWED_DM_EMAILS:-}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:-}
      SESSION_JWT_TTL_SECONDS: ${SESSION_JWT_TTL_SECONDS:-604800}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-15552000}
      REVOKED_PLAYERS: ${REVOKED_PLAYERS:-}
      STATBLOCK_INGEST_TOKEN: ${STATBLOCK_INGEST_TOKEN:-}
      STATBLOCK_MAX_BYTES: ${STATBLOCK_MAX_BYTES:-2000000}
      PLAYER_LOGIN_CODES: ${PLAYER_LOGIN_CODES:-}
      PLAYER_CODE_CAR: ${PLAYER_CODE_CAR:-}
      PLAYER_CODE_KRYTON: ${PLAYER_CODE_KRYTON:-}
      PLAYER_CODE_LOTAN: ${PLAYER_CODE_LOTAN:-}
      PLAYER_CODE_NONAME: ${PLAYER_CODE_NONAME:-}
      PLAYER_CODE_ORABELLA: ${PLAYER_CODE_ORABELLA:-}
      PLAYER_CODE_ROXY: ${PLAYER_CODE_ROXY:-}
      PLAYER_CODE_VALEN: ${PLAYER_CODE_VALEN:-}
      PLAYER_CODE_DUSTIN: ${PLAYER_CODE_DUSTIN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:dm@valleyofshadows.wiki}
      # OpenAI image generation (used by the /art slash command)
      OPENAI_KEY: ${OPENAI_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      IMAGE_QUALITY: ${IMAGE_QUALITY:-high}
      IMAGE_SIZE: ${IMAGE_SIZE:-1024x1024}
      IMAGE_STYLE_PROMPT: ${IMAGE_STYLE_PROMPT:-}
      STUDIO_MONTHLY_QUOTA: ${STUDIO_MONTHLY_QUOTA:-30}
      IMAGE_TITLE_MODEL: ${IMAGE_TITLE_MODEL:-claude-haiku-4-5-20251001}
      IMAGE_TITLE_TIMEOUT_S: ${IMAGE_TITLE_TIMEOUT_S:-12}
      GALLERY_MAX_ENTRIES: ${GALLERY_MAX_ENTRIES:-2000}
      GALLERY_PAGE_LIMIT: ${GALLERY_PAGE_LIMIT:-60}
      # CORS allowlist (comma-separated origins). Unset = fall open to
      # "*" for local dev.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # /api/chat rate limit (Flask-Limiter syntax, e.g. "60/hour;10/minute").
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-30/hour;5/minute}
      # Max bytes of conversation_history accepted per /api/chat call.
      MAX_CONVERSATION_BYTES: ${MAX_CONVERSATION_BYTES:-60000}
      QUERY_EXPANSION_ENABLED: ${QUERY_EXPANSION_ENABLED:-1}
      QUERY_EXPANSION_CACHE_TTL: ${QUERY_EXPANSION_CACHE_TTL:-3600}
      QUERY_EXPANSION_CACHE_MAX: ${QUERY_EXPANSION_CACHE_MAX:-256}
      AUTO_REBUILD_ON_WIKI_SAVE: ${AUTO_REBUILD_ON_WIKI_SAVE:-1}
      AUTO_KNOWLEDGE_ON_WIKI_SAVE: ${AUTO_KNOWLEDGE_ON_WIKI_SAVE:-1}
      REBUILD_COMMAND_TIMEOUT_SECONDS: ${REBUILD_COMMAND_TIMEOUT_SECONDS:-900}
    volumes:
      # Campaign data files + vector stores (read-only)
      - ./campaign-data:/app/data:ro
      # Writable volume for chat logs
      - ./logs:/app/logs
      # PWA runtime database — one SQLite file, backed up by copying it.
      - ./app-data:/app/app-data
      # Art Studio gallery — persisted images + manifest. Survives container
      # rebuilds. Created on first generation if it doesn't exist on the host.
      - ./generated-art:/app/generated-art
      # Repo mounted in for Eleventy to read markdown/templates and write _site.
      # Eleventy + Pagefind live in /opt/eleventy (baked into the image),
      # so no anonymous-volume shadow is needed for /site/node_modules.
      - .:/site
    networks:
      - dnd-network
    restart: unless-stopped

  # Nginx - the web server that handles all incoming requests and routes them
  nginx:
    image: nginx:alpine
    container_name: dnd_nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Nginx config tells it how to route different URLs
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Standalone documents served at /files/ — gitignored, lives only on
      # the host. Drop a file in, share its (unguessable) URL.
      - ./public-files:/srv/public-files:ro
      # Built Eleventy PWA. The chatbot container writes /site/_site.
      - .:/site:ro
    depends_on:
      - chatbot
    networks:
      - dnd-network
    restart: unless-stopped

# Docker networks let containers talk to each other by name
networks:
  dnd-network:
    driver: bridge
