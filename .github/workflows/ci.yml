name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install -r chatbot/requirements-dev.txt
      - run: npm ci
      - run: pytest chatbot/tests -q
      - run: ruff check .
      - run: npm run lint:js
      - run: npm run build
